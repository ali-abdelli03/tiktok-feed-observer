# ============================================================================
# TikTok Scraper Backend - Application Configuration
# ============================================================================

spring.application.name=Social Tracker Backend

# Server Configuration
server.address=0.0.0.0
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================================
# PostgreSQL Database Configuration
# ============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tiktok_scraper
spring.datasource.username=postgres
spring.datasource.password=new_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ============================================================================
# JPA / Hibernate Configuration
# ============================================================================
# Use 'create' for first run to drop/recreate tables, then change to 'update'
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batch processing for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# PostgreSQL-specific settings
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

# ============================================================================
# Thymeleaf Configuration
# ============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.socialtracker=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ============================================================================
# Jackson JSON Configuration
# ============================================================================
spring.jackson.default-property-inclusion=non_null