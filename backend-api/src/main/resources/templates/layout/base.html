<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="html(title, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Observer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-purple: #8b5cf6;
            --neon-pink: #ec4899;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        /* Layout */
        .app-container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0; bottom: 0; left: 0;
            padding: 1.5rem;
            z-index: 1000;
        }
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 2rem;
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.1), transparent 40%);
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Typography */
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        .text-label {
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Navigation */
        .nav-link {
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .nav-link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-link.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), transparent);
            color: white;
            border-left: 3px solid var(--neon-purple);
        }
        .nav-link i { margin-right: 0.75rem; font-size: 1.1rem; }

        /* Custom Table */
        .table-custom {
            --bs-table-bg: transparent;
            --bs-table-color: var(--text-primary);
            --bs-table-border-color: var(--border-color);
        }
        .table-custom th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom-width: 1px;
            padding: 1rem 0.5rem;
        }
        .table-custom td {
            padding: 1rem 0.5rem;
            vertical-align: middle;
            border-bottom-color: rgba(255,255,255,0.05);
        }

        /* Utilities */
        .btn-glow {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border: none;
            color: white;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        .btn-glow:hover {
            opacity: 0.9;
            color: white;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <a class="brand-logo text-decoration-none text-white fs-4 fw-bold mb-4 d-block" th:href="@{/dashboard}">
            <i class="bi bi-cpu-fill me-2" style="color: var(--neon-purple);"></i><span>OBSERVER</span>
        </a>

        <div class="text-label px-3 mt-4">Platform</div>
        <nav class="nav flex-column mt-2">
            <a class="nav-link" th:classappend="${requestURI == '/dashboard' or requestURI == '/dashboard/'} ? 'active'" th:href="@{/dashboard}">
                <i class="bi bi-speedometer2"></i> Mission Control
            </a>
            <a class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/dashboard/videos')} ? 'active'" th:href="@{/dashboard/videos}">
                <i class="bi bi-collection-play"></i> Video Feed
            </a>
            <a class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/dashboard/profiles')} ? 'active'" th:href="@{/dashboard/profiles}">
                <i class="bi bi-person-bounding-box"></i> Creators
            </a>
        </nav>

        <div class="text-label px-3 mt-4">Intelligence</div>
        <nav class="nav flex-column mt-2">
            <a class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/dashboard/comments')} ? 'active'" th:href="@{/dashboard/comments}">
                <i class="bi bi-chat-left-text"></i> Comments
            </a>
            <a class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/dashboard/testers')} ? 'active'" th:href="@{/dashboard/testers}">
                <i class="bi bi-people-fill"></i> Testers
            </a>
            <a class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/dashboard/search')} ? 'active'" th:href="@{/dashboard/search}">
                <i class="bi bi-binoculars"></i> Search Logs
            </a>
        </nav>

        <div class="mt-auto pt-4 px-3">
            <div class="text-secondary small font-mono opacity-50">v1.0.0-BETA</div>
        </div>
    </aside>

    <main class="main-content">
        <div th:replace="${content}"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div th:replace="${scripts}"></div>

</body>
</html>
