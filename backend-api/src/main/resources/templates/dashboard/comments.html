<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title>Sentiment • Observer</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Global Sentiment</h2>
            <p class="text-secondary m-0">Live feed of captured user comments.</p>
        </div>
    </div>

    <div class="glass-panel p-0">
        <div class="list-group list-group-flush">
            <div class="list-group-item p-4" th:each="comment : ${comments}"
                 style="background: transparent; border-bottom: 1px solid var(--border-color);">
                <div class="row">
                    <div class="col-md-3 border-end border-secondary border-opacity-10">
                        <div class="text-white fw-bold mb-1" th:text="${comment.authorHandle}">@user</div>
                        <div class="text-tertiary small font-mono mb-2" th:text="${#temporals.format(comment.capturedAt, 'yyyy-MM-dd HH:mm')}">Date</div>
                        <a th:href="@{/dashboard/videos/{id}(id=${comment.videoPlatformId})}" class="badge bg-dark border border-secondary text-secondary text-decoration-none fw-normal">
                            <i class="bi bi-play-circle me-1"></i> Source
                        </a>
                    </div>
                    <div class="col-md-9 ps-md-4 mt-2 mt-md-0">
                        <p class="text-secondary mb-2" th:text="${comment.textContent}">Comment content goes here...</p>
                        <div class="d-flex gap-3 text-tertiary small">
                            <span><i class="bi bi-heart me-1"></i> <span th:text="${comment.likes}">0</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:fragment="scripts"></div>
</body>
</html>
