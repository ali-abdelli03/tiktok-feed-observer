<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title>Signal Intercept • NEXUS</title>
</head>
<body>
<div th:fragment="content">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="page-title">
                <span class="text-gradient">Signal Intercept</span>
            </h1>
            <p class="page-subtitle">Live comment feed • Sentiment data stream</p>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="font-mono text-purple" th:text="${#lists.size(comments)} + ' signals'">0 signals</span>
        </div>
    </div>

    <!-- Comments List -->
    <div class="glass-panel glow p-0">
        <div class="d-flex flex-column">
            <div th:each="comment : ${comments}"
                 class="p-3" style="border-bottom: 1px solid rgba(153, 69, 255, 0.08);">
                <div class="row">
                    <div class="col-md-3" style="border-right: 1px solid rgba(153, 69, 255, 0.08);">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <div class="d-flex align-items-center justify-content-center"
                                 style="width: 32px; height: 32px; background: var(--accent-gradient); border-radius: 50%;">
                                <i class="bi bi-person text-white" style="font-size: 0.8rem;"></i>
                            </div>
                            <span class="text-white" th:text="${comment.authorHandle}">@user</span>
                        </div>
                        <div class="font-mono text-muted-custom small mb-2" th:text="${#temporals.format(comment.capturedAt, 'MMM dd HH:mm')}">Date</div>
                        <a th:href="@{/dashboard/videos/{id}(id=${comment.videoPlatformId})}" class="btn-cosmos btn-sm">
                            <i class="bi bi-film me-1"></i> SOURCE
                        </a>
                    </div>
                    <div class="col-md-9 ps-md-4 mt-2 mt-md-0">
                        <p class="text-white mb-2" th:text="${comment.textContent}">Comment content...</p>
                        <div class="d-flex gap-3">
                            <span class="font-mono small text-pink">
                                <i class="bi bi-heart-fill me-1"></i>
                                <span th:text="${comment.likes}">0</span>
                            </span>
                            <span th:if="${comment.likedByAuthor}" class="badge-cosmos badge-pink">
                                <i class="bi bi-heart me-1"></i>CREATOR LIKED
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(comments)}" class="text-center text-muted-custom py-5">
                <i class="bi bi-chat-square-text me-2" style="font-size: 2rem;"></i>
                <div class="mt-2">No signals intercepted</div>
            </div>
        </div>
    </div>
</div>
<div th:fragment="scripts"></div>
</body>
</html>
