<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title th:text="${profile.platformHandle} + ' • Observer'">Profile</title>
</head>
<body>
<div th:fragment="content">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb small font-mono">
            <li class=\"breadcrumb-item\"><a th:href="@{/dashboard}" class="text-secondary text-decoration-none">HOME</a></li>
            <li class=\"breadcrumb-item\"><a th:href="@{/dashboard/profiles}" class="text-secondary text-decoration-none">PROFILES</a></li>
            <li class="breadcrumb-item active text-white" aria-current="page">OVERVIEW</li>
        </ol>
    </nav>

    <div class="glass-panel mb-4 position-relative overflow-hidden p-4">
        <div style="position: absolute; top: -50%; left: -10%; width: 50%; height: 200%; background: radial-gradient(circle, rgba(139, 92, 246, 0.1), transparent 60%); transform: rotate(15deg);"></div>

        <div class="d-flex flex-wrap align-items-center justify-content-between position-relative z-1">
            <div class="d-flex align-items-center gap-4">
                <div class="rounded-circle d-flex align-items-center justify-content-center shadow-lg border border-2 border-dark"
                     style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); font-size: 2.5rem; color: white; font-weight: 800;"
                     th:text="${#strings.substring(profile.platformHandle, 0, 1).toUpperCase()}">
                    A
                </div>
                <div>
                    <h1 class="display-6 fw-bold mb-0 d-flex align-items-center gap-2">
                        <span th:text="${profile.platformHandle}">handle</span>
                        <i th:if="${profile.isVerified}" class="bi bi-patch-check-fill text-primary fs-5" title="Verified"></i>
                    </h1>
                    <p class="text-secondary mb-2" th:text="${profile.displayName}">Display Name</p>
                    <div class="d-flex gap-2">
                        <span class="badge bg-dark border border-secondary text-secondary" th:text="${profile.platformId}">ID: 12345</span>
                        <span class="badge bg-dark border border-secondary text-secondary">TikTok</span>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-5 text-end mt-4 mt-lg-0">
                <div>
                    <div class="text-label">Followers</div>
                    <div class="fs-4 fw-bold font-mono text-white" th:text="${profile.followerCount != null ? #numbers.formatInteger(profile.followerCount, 0, 'COMMA') : 'N/A'}">0</div>
                </div>
                <div>
                    <div class="text-label">Total Likes</div>
                    <div class="fs-4 fw-bold font-mono text-white" th:text="${profile.likesCount != null ? #numbers.formatInteger(profile.likesCount, 0, 'COMMA') : 'N/A'}">0</div>
                </div>
                <div>
                    <div class="text-label">Videos</div>
                    <div class="fs-4 fw-bold font-mono text-white" th:text="${profile.videoCount}">0</div>
                </div>
            </div>
        </div>

        <div class="mt-4 pt-3 border-top border-secondary border-opacity-10">
            <p class="text-secondary small mb-0" style="max-width: 800px;" th:text="${profile.signature ?: 'No bio available.'}">Bio...</p>
        </div>
    </div>

    <h4 class="mb-3">Content History</h4>
    <div class="glass-panel p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom mb-0">
                <thead>
                <tr>
                    <th class="ps-4">Video Asset</th>
                    <th>Description</th>
                    <th>Engagement</th>
                    <th>Tags</th>
                    <th class="text-end pe-4">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="video : ${videos}">
                    <td class="ps-4">
                        <div class="d-flex flex-column">
                            <span class="font-mono text-white small" th:text="${video.platformId}">ID</span>
                            <span class="text-tertiary small" th:text="${#temporals.format(video.firstSeenAt, 'MMM d, yyyy')}">Date</span>
                        </div>
                    </td>
                    <td>
                        <div class="text-secondary small text-truncate" style="max-width: 250px;" th:text="${video.description}">Desc</div>
                    </td>
                    <td>
                        <div class="d-flex gap-3 small text-white">
                            <span><i class="bi bi-heart-fill text-danger me-1"></i> <span th:text="${video.likes ?: 0}">0</span></span>
                            <span><i class="bi bi-chat-fill text-info me-1"></i> <span th:text="${video.comments ?: 0}">0</span></span>
                        </div>
                    </td>
                    <td>
                        <span th:if="${video.isAd}" class="badge bg-warning-subtle text-warning border-warning">AD</span>
                        <span th:if="${video.isLive}" class="badge bg-danger-subtle text-danger border-danger">LIVE</span>
                        <span th:if="${!video.isAd and !video.isLive}" class="text-muted small">-</span>
                    </td>
                    <td class="text-end pe-4">
                        <a th:href="@{/dashboard/videos/{id}(id=${video.platformId})}" class="btn btn-sm btn-outline-secondary border-secondary text-white">View Data</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(videos)}">
                    <td colspan="5" class="text-center py-5">
                        <div class="text-muted opacity-50 mb-2" style="font-size: 2rem;"><i class="bi bi-camera-video-off"></i></div>
                        <div class="text-secondary">No media indexed for this profile</div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:fragment="scripts"></div>
</body>
</html>
