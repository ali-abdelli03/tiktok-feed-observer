<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title>Video Analytics • Observer</title>
</head>
<body>
<div th:fragment="content">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb small font-mono">
            <li class="breadcrumb-item"><a th:href="@{/dashboard/videos}" class="text-secondary text-decoration-none">FEED</a></li>
            <li class="breadcrumb-item active text-white" aria-current="page" th:text="${video.platformId}">ID</li>
        </ol>
    </nav>

    <div class="row g-4 h-100">
        <div class="col-lg-5">
            <div class="glass-panel h-100 position-relative">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <span class="badge bg-dark border border-secondary text-secondary font-mono">VIDEO ASSET</span>
                    <a th:href="${video.webUrl}" target="_blank" class="btn btn-sm btn-outline-secondary border-secondary text-white">
                        Open in TikTok <i class="bi bi-box-arrow-up-right ms-1"></i>
                    </a>
                </div>

                <h4 class="mb-3 text-break" th:text="${video.description ?: 'No description'}">Desc</h4>

                <div class="d-flex align-items-center gap-3 mb-4 p-3 rounded-3" style="background: rgba(255,255,255,0.03);">
                    <div class="rounded-circle bg-gradient" style="width: 40px; height: 40px; background: var(--neon-purple);"></div>
                    <div>
                        <div class="text-label mb-0">Author</div>
                        <a th:href="@{/dashboard/profiles/{h}(h=${video.authorHandle})}" class="text-white text-decoration-none fw-bold" th:text="${'@' + video.authorHandle}">@user</a>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-6">
                        <div class="p-3 rounded-3 border border-secondary border-opacity-25 bg-dark">
                            <div class="text-label">Likes</div>
                            <div class="fs-3 fw-bold text-white font-mono" th:text="${video.stats?.likeCount ?: 0}">0</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 rounded-3 border border-secondary border-opacity-25 bg-dark">
                            <div class="text-label">Comments</div>
                            <div class="fs-3 fw-bold text-white font-mono" th:text="${video.stats?.commentCount ?: 0}">0</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 rounded-3 border border-secondary border-opacity-25 bg-dark">
                            <div class="text-label">Shares</div>
                            <div class="fs-3 fw-bold text-white font-mono" th:text="${video.stats?.shareCount ?: 0}">0</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 rounded-3 border border-secondary border-opacity-25 bg-dark">
                            <div class="text-label">Views</div>
                            <div class="fs-3 fw-bold text-white font-mono" th:text="${video.stats?.playCount ?: 0}">0</div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top border-secondary border-opacity-10">
                    <div class="text-label">Metadata</div>
                    <div class="font-mono small text-secondary mt-2">
                        <div>INGESTED: <span class="text-white" th:text="${#temporals.format(video.firstSeenAt, 'yyyy-MM-dd HH:mm:ss')}"></span></div>
                        <div>DURATION: <span class="text-white" th:text="${video.duration != null ? video.duration + 'ms' : 'N/A'}"></span></div>
                        <div>MUSIC: <span class="text-white" th:text="${video.music?.title ?: 'Original Sound'}"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="glass-panel h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Sentiment Stream</h5>
                    <span class="badge bg-primary-subtle text-primary border-primary" th:text="${#lists.size(comments) + ' parsed'}">0</span>
                </div>

                <div class="flex-grow-1 overflow-auto pe-2" style="max-height: 600px;">
                    <div class="d-flex flex-column gap-2">
                        <div th:each="comment : ${comments}" class="p-3 rounded-3" style="background: rgba(255,255,255,0.03); border-left: 2px solid var(--border-color);">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="text-white fw-bold small" th:text="${comment.authorHandle}">user</span>
                                    <span th:if="${comment.likedByAuthor}" class="badge bg-danger-subtle text-danger" style="font-size: 0.6rem;">AUTHOR LIKED</span>
                                </div>
                                <span class="text-tertiary font-mono" style="font-size: 0.7rem;" th:text="${#temporals.format(comment.capturedAt, 'HH:mm')}">time</span>
                            </div>
                            <p class="mb-1 text-secondary small" th:text="${comment.textContent}">Comment...</p>
                            <div class="text-tertiary" style="font-size: 0.7rem;">
                                <i class="bi bi-heart-fill me-1"></i> <span th:text="${comment.likes}">0</span>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(comments)}" class="text-center py-5">
                            <div class="text-muted opacity-25" style="font-size: 3rem;"><i class="bi bi-chat-square-dots"></i></div>
                            <p class="text-secondary mt-2">No comments captured yet.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="scripts"></div>
</body>
</html>
