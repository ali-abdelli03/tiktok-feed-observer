<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title>Video Feed • Observer</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Video Feed</h2>
            <p class="text-secondary m-0">Global ingestion history and metadata.</p>
        </div>

        <form class="d-flex gap-2" th:action="@{/dashboard/search}">
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-search"></i></span>
                <input type="text" name="q" class="form-control bg-dark text-white border-secondary" placeholder="Filter by ID, Author..." style="min-width: 300px;">
                <input type="hidden" name="type" value="videos">
            </div>
        </form>
    </div>

    <div class="glass-panel p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom mb-0">
                <thead>
                <tr>
                    <th class="ps-4" style="width: 25%;">Video Asset</th>
                    <th style="width: 20%;">Creator</th>
                    <th style="width: 25%;">Context / Desc</th>
                    <th style="width: 15%;">Performance</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="video : ${videos}">
                    <td class="ps-4">
                        <div class="d-flex flex-column">
                            <span class="font-mono text-white small mb-1" th:text="${video.platformId}">ID</span>
                            <span class="badge rounded-pill bg-dark border border-secondary text-secondary fw-normal"
                                  style="width: fit-content; font-size: 0.65rem;"
                                  th:text="${#temporals.format(video.firstSeenAt, 'MMM dd • HH:mm')}">Date</span>
                        </div>
                    </td>
                    <td>
                        <a th:href="@{/dashboard/profiles/{h}(h=${video.authorHandle})}" class="text-decoration-none">
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle bg-gradient" style="width: 8px; height: 8px; background: var(--neon-purple);"></div>
                                <span class="text-white small fw-medium" th:text="${video.authorHandle}">@user</span>
                            </div>
                        </a>
                    </td>
                    <td>
                        <div class="text-secondary small text-truncate" style="max-width: 300px; opacity: 0.8;"
                             th:text="${video.description}">Description content...</div>
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <div class="d-flex align-items-center gap-1">
                                <i class="bi bi-heart-fill text-danger" style="font-size: 0.7rem;"></i>
                                <span class="font-mono small text-white" th:text="${video.stats?.likeCount}">0</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <i class="bi bi-chat-fill text-primary" style="font-size: 0.7rem;"></i>
                                <span class="font-mono small text-white" th:text="${video.stats?.commentCount}">0</span>
                            </div>
                        </div>
                    </td>
                    <td class="text-end pe-4">
                        <a th:href="@{/dashboard/videos/{id}(id=${video.platformId})}"
                           class="btn btn-sm btn-outline-secondary border-secondary text-white"
                           style="font-size: 0.75rem;">
                            Analyze
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center px-4 py-3 border-top border-secondary border-opacity-10">
            <span class="text-tertiary small font-mono">
                PAGE <span th:text="${videos.number + 1}">1</span> / <span th:text="${videos.totalPages}">10</span>
            </span>
            <div class="btn-group">
                <a th:if="${videos.hasPrevious()}" th:href="@{/dashboard/videos(page=${videos.number - 1})}" class="btn btn-sm btn-outline-secondary text-white">Previous</a>
                <a th:if="${videos.hasNext()}" th:href="@{/dashboard/videos(page=${videos.number + 1})}" class="btn btn-sm btn-outline-secondary text-white">Next</a>
            </div>
        </div>
    </div>
</div>

<div th:fragment="scripts"></div>

</body>
</html>
