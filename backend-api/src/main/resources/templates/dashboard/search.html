<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title>Search - TikTok Scraper</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Search</h1>
            <p class="text-muted">Search through scraped data</p>
        </div>
        
        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/dashboard/search}" method="get" class="row g-3">
                    <div class="col-md-8">
                        <input type="text" name="q" class="form-control form-control-lg" 
                               placeholder="Search videos or profiles..." th:value="${query}">
                    </div>
                    <div class="col-md-2">
                        <select name="type" class="form-select form-select-lg">
                            <option value="videos" th:selected="${type == 'videos'}">Videos</option>
                            <option value="profiles" th:selected="${type == 'profiles'}">Profiles</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary btn-lg w-100">Search</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Results -->
        <div th:if="${query != null and query != ''}">
            <h5 class="mb-3">Results for "<span th:text="${query}">query</span>"</h5>
            
            <!-- Video Results -->
            <div th:if="${type == 'videos' and results != null}" class="card">
                <div class="card-body p-0" th:if="${not #lists.isEmpty(results)}">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Author</th>
                                    <th>Description</th>
                                    <th>Stats</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="video : ${results}">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <div class="author-avatar me-2" th:text="${video.authorHandle != null} ? ${#strings.substring(video.authorHandle, 0, 1).toUpperCase()} : '?'">A</div>
                                            <span th:text="${video.authorHandle ?: 'Unknown'}">@author</span>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="truncate" th:text="${video.description ?: 'No description'}">Description</div>
                                    </td>
                                    <td>
                                        <span class="engagement-stat">❤️ <span th:text="${video.likes ?: 0}">0</span></span>
                                    </td>
                                    <td>
                                        <a th:href="@{/dashboard/videos/{id}(id=${video.platformId})}" class="btn btn-sm btn-outline-primary">View</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-body" th:if="${#lists.isEmpty(results)}">
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p class="text-muted">No videos found matching your search</p>
                    </div>
                </div>
            </div>
            
            <!-- Profile Results -->
            <div th:if="${type == 'profiles' and results != null}" class="card">
                <div class="card-body p-0" th:if="${not #lists.isEmpty(results)}">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Profile</th>
                                    <th>Display Name</th>
                                    <th>Followers</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="profile : ${results}">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <div class="author-avatar me-2" th:text="${#strings.substring(profile.platformHandle, 0, 1).toUpperCase()}">A</div>
                                            <span th:text="'@' + ${profile.platformHandle}">@handle</span>
                                            <span th:if="${profile.isVerified}" class="badge badge-verified ms-1">✓</span>
                                        </div>
                                    </td>
                                    <td th:text="${profile.displayName ?: '-'}">Name</td>
                                    <td th:text="${profile.followerCount != null} ? ${#numbers.formatInteger(profile.followerCount, 0, 'COMMA')} : '-'">-</td>
                                    <td>
                                        <a th:href="@{/dashboard/profiles/{handle}(handle=${profile.platformHandle})}" class="btn btn-sm btn-outline-primary">View</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-body" th:if="${#lists.isEmpty(results)}">
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p class="text-muted">No profiles found matching your search</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:fragment="scripts"></div>
</body>
</html>
