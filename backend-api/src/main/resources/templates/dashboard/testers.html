<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title>Operatives • NEXUS</title>
</head>
<body>
<div th:fragment="content">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="page-title">
                <span class="text-gradient">Field Operatives</span>
            </h1>
            <p class="page-subtitle">Active surveillance nodes • Scraper instances</p>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center gap-2 glass-panel py-2 px-3">
                <span class="status-dot online"></span>
                <span class="font-display text-gradient" th:text="${#lists.size(testers)}">0</span>
                <span class="text-label mb-0">NODES</span>
            </div>
        </div>
    </div>

    <!-- Operatives Table -->
    <div class="glass-panel glow p-0">
        <div class="table-responsive">
            <table class="table table-cosmos mb-0">
                <thead>
                <tr>
                    <th class="ps-3">Status</th>
                    <th>Agent Identifier</th>
                    <th>Sessions</th>
                    <th>Registered</th>
                    <th>Last Heartbeat</th>
                    <th class="text-end pe-3">Activity</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tester : ${testers}">
                    <td class="ps-3">
                        <div class="d-flex align-items-center gap-2">
                            <span th:if="${tester.lastActiveAt != null and tester.lastActiveAt.isAfter(T(java.time.LocalDateTime).now().minusHours(1))}"
                                  class="status-dot online"></span>
                            <span th:unless="${tester.lastActiveAt != null and tester.lastActiveAt.isAfter(T(java.time.LocalDateTime).now().minusHours(1))}"
                                  class="status-dot offline"></span>
                        </div>
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="d-flex align-items-center justify-content-center"
                                 style="width: 32px; height: 32px; background: rgba(153, 69, 255, 0.2); border-radius: 4px;">
                                <i class="bi bi-robot text-purple"></i>
                            </div>
                            <span class="font-mono text-white" th:text="${tester.username}">user</span>
                        </div>
                    </td>
                    <td>
                        <span class="badge-cosmos badge-purple" th:text="${#lists.size(tester.sessions)}">0</span>
                    </td>
                    <td class="font-mono text-muted-custom small" th:text="${tester.createdAt != null ? #temporals.format(tester.createdAt, 'MMM dd, yyyy') : 'N/A'}">Date</td>
                    <td class="font-mono small"
                        th:classappend="${tester.lastActiveAt != null and tester.lastActiveAt.isAfter(T(java.time.LocalDateTime).now().minusHours(1))} ? 'text-gradient' : 'text-muted-custom'"
                        th:text="${tester.lastActiveAt != null ? #temporals.format(tester.lastActiveAt, 'MMM dd HH:mm:ss') : 'Never'}">Time</td>
                    <td class="text-end pe-3">
                        <div class="progress-cosmos" style="width: 80px; display: inline-block;">
                            <div class="progress-bar" role="progressbar" 
                                 th:style="'width: ' + ${tester.lastActiveAt != null and tester.lastActiveAt.isAfter(T(java.time.LocalDateTime).now().minusHours(1)) ? '100' : '20'} + '%'"></div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(testers)}">
                    <td colspan="6" class="text-center text-muted-custom py-5">
                        <i class="bi bi-robot me-2" style="font-size: 2rem;"></i>
                        <div class="mt-2">No operatives registered</div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:fragment="scripts"></div>
</body>
</html>
